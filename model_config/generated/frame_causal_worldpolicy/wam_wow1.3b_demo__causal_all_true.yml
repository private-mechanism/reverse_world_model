# =============================================================================
# World Policy（因果 + 128dim + value）— model_config schema_version: 2
# 数据：`data.common` / `data.dataset`；训练 EMA：`training.ema`；
# 网络：`architecture.model` → 展开为扁平 `model_structure`；token 维可由 action_expert/common 推断。
# =============================================================================
schema_version: 2
num_sample_batches: 1

experiment:
  id: robotwin-25000-demo-wow1.3b-causal_all_true
  wandb_project: frame-causal-WorldPolicy
  cuda_visible_devices: "0,1"

  config_name: causal_all_true
data:
  paths:
    - /mnt/damoxing/datasets/RoboTwin2_0_processed/robotwin_clean_5k_2
  consumer_dataset_type: finetune
  hdf5:
    use_prompt_template: false
  common:
    img_history_size: 1
    action_chunk_size: 32
    num_cameras: 3
    num_vision_patches: 729
    state_dim: 128
    norm_minmax: true
    statistics_mode: separate
  dataset:
    buf_path: /path/to/buffer
    buf_num_chunks: 512
    buf_chunk_size: 512
    epsd_len_thresh_low: 32
    epsd_len_thresh_high: 2048
    image_aspect_ratio: pad
    tokenizer_max_length: 1024
    pred_video: true
    sample_video_fps: 1
    video_size: [384, 320]
    num_cameras: 3

architecture:
  model:
    action_expert:
      in_action_dim: 256
      in_visual_dim: 1152
      out_action_dim: 128
      inner_dim: 768
      num_layers: 30
      num_attention_heads: 12
      attention_head_dim: 128
      text_dim: 4096
      freq_dim: 256
      ffn_dim: 3072
      max_seq_len: 512
      visual_encoder_type: siglip2
      eps: 1.0e-06
      use_new_rope: true
      scaling: 4.0
      use_value: false
      frame_causal_self_attn: true
    action_noise_scheduler:
      type: flow
      num_train_timesteps: 1000
      num_inference_timesteps: 5
      beta_schedule: squaredcos_cap_v2
      prediction_type: sample
      clip_sample: false
      alpha: 1.0
      beta: 1.0
      noise_s: 0.999
      distribution_type: beta

    video_frame_causal_self_attn: true
    action_video_frame_causal_kv: true
  model_name: world_policy_causal_value
  video_variant: wow1.3b
  causal_world_training: true
  dataset_type: 128dim_with_value
  image_aug_type: mixed

checkpoints:
  run_name: demo-wow1.3b-causal_all_true
  root_dir: checkpoints

weights:
  # pretrained_model_name_or_path: ../../weights/RDT/rdt-1b
  text_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers
  vision_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/siglip2-so400m-patch14-384
  action_expert: none
  video_expert: none
  video_base_model: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers

  # video_base_model: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers
  # text_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers
  # vision_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/siglip2-so400m-patch14-384

training:
  batch:
    train: 1
    sample: 1
  vae_mini_batch: 2
  max_train_steps: 15000
  checkpointing_period: 7500  # ZeRO-3 存盘仍有 CPU/GPU 峰值；过密易 SIGKILL(-9) OOM
  sample_period: 10  # 每 N 步在主进程采样；不在 step0 做（启动即跑 Wan 推理会很久）
  sample_light: false
  sample_joint_only: true
  sample_sharded_inference: false  # 非 DeepSpeed：各 rank 数据并行采样
  checkpoints_total_limit: 5
  dataloader_num_workers: 4
  gradient_accumulation_steps: 1
  state_noise_snr: 80
  cond_mask_prob: -1
  ema:
    enabled: false  # false：关闭 EMA，省约一份模型显存；采样与 checkpoint 仅用训练权重
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

  sample_compute_video_metrics: true
  sample_save_video: false
optimizer:
  learning_rate: 0.0001
  lr:
    scheduler: custom_constant_then_decay
    warmup_steps: 10
    hold_ratio: 0.2

logging:
  report_to: wandb
  # report_to: tensorboard
  # resume_from_checkpoint: latest

runtime:
  mixed_precision: bf16
  load_from_hdf5: true
  gradient_checkpointing: true
  image_aug: true

distributed:
  deepspeed: off

inference: {}
