# =============================================================================
# 多任务混合：processed_0506 当前全部 tienyi_prod2 真机任务（39 系 7 个 + 66 系 12 个 = 19 根目录）。
# 说明：HDF5 统计默认以 paths 第一项为主目录；混合训练建议调大 max_train_steps / checkpoint 周期。
# =============================================================================

schema_version: 2

experiment:
  id: robotwin-25000-wan
  wandb_project: WorldPolicy-DownStream
  cuda_visible_devices: "0,1,2,3,4,5"

data:
  paths:
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_Hold-coffee-and-pick-up-backpack_20260429_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_Put-the-book-into-the-backpack_20260508_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_close_20260507_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_fold_clothes2_20260429_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_fold_clothes_20260429_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_pick_up_neat_clothes_20260429_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_39_press_capsule_coffee_maker_switch_20260507_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Make-coffee_20260509_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Open-the-backpack-zipper
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Open_the_package_Open_the_package_20260507_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Pick_up_the_package_from_the_shelf_20260508_pm2
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Put_the_courier_on_the_table_20260508_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Switch_off_the_light
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_Take-the-book-from-box-and-place-on-table_20260507_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_cut_open_parcel_box_with_knife_20260509_pm
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_drop_the_neat_clothes_20260430_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_open_the_curtains_20260506_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_organize-and-store-items-on-the-desktop_260509_am
    - /mnt/dataset/datasets/RoboTwin2_0_processed/tianyi_data/processed_0506/tienyi_prod2_dualArm-gripper-3cameras_66_turn_on_the_light
  consumer_dataset_type: finetune
  hdf5:
    use_prompt_template: false
    control_freqs_path: configs/real_world_control_freqs.json
    target_control_freq: 15
  common:
    img_history_size: 1
    action_chunk_size: 32
    num_cameras: 3
    num_vision_patches: 729
    state_dim: 128
    norm_minmax: true
    statistics_mode: separate
  dataset:
    buf_path: /path/to/buffer
    buf_num_chunks: 512
    buf_chunk_size: 512
    epsd_len_thresh_low: 32
    epsd_len_thresh_high: 2048
    image_aspect_ratio: pad
    tokenizer_max_length: 1024
    pred_video: true
    sample_video_fps: 1
    video_size: [384, 320]
    num_cameras: 1

architecture:
  model:
    action_expert:
      in_action_dim: 256
      in_visual_dim: 1152
      out_action_dim: 128
      inner_dim: 768
      num_layers: 30
      num_attention_heads: 12
      attention_head_dim: 128
      text_dim: 4096
      freq_dim: 256
      ffn_dim: 3072
      max_seq_len: 512
      visual_encoder_type: siglip2
      eps: 1.0e-06
      use_new_rope: true
      scaling: 4.0
      use_value: true
    action_noise_scheduler:
      type: flow
      num_train_timesteps: 1000
      num_inference_timesteps: 5
      beta_schedule: squaredcos_cap_v2
      prediction_type: sample
      clip_sample: false
      alpha: 1.5
      beta: 1.0
      noise_s: 0.999
      distribution_type: beta

  model_name: world_policy_causal_value
  causal_world_training: true
  dataset_type: 128dim_with_value
  image_aug_type: mixed

checkpoints:
  run_name: 0509-i3-tienkung-bundle-all-tienkung-0506
  root_dir: checkpoints

weights:
  text_encoder: /mnt/dataset/projs/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers
  vision_encoder: /mnt/dataset/ckpt/pretrained_models/siglip2-so400m-patch14-384/
  action_expert: none
  video_expert: checkpoints/rb-motus-video-c32/checkpoint-15000

training:
  batch:
    train: 4
    sample: 1
  vae_mini_batch: 4
  max_train_steps: 80000
  checkpointing_period: 2000
  sample_period: 400
  checkpoints_total_limit: 5
  dataloader_num_workers: 8
  gradient_accumulation_steps: 1
  state_noise_snr: 40
  cond_mask_prob: -1
  ema:
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

optimizer:
  learning_rate: 0.0001
  lr:
    scheduler: custom_constant_then_decay
    warmup_steps: 10
    hold_ratio: 0.2

logging:
  report_to: tensorboard

runtime:
  mixed_precision: bf16
  load_from_hdf5: true
  gradient_checkpointing: true
  image_aug: true

distributed:
  deepspeed: off

inference: {}

skip_still_steps: false
skip_still_window: 2
skip_still_eps: 1.0e-4
