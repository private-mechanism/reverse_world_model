# =============================================================================
# Stage 1 validation: fixed-horizon oracle reverse WVWAM.
#
# Goal:
#   Verify that WVWAM can learn reverse-time video/action targets when the
#   terminal video frame is still provided by the GT fixed-horizon clip.
#
# What this enables:
#   - subtrajectory_mode=fixed_horizon samples length-32 action chunks.
#   - reverse_world_order=true flips video/action targets in world training.
#   - video/action metrics are computed in the same reverse target view.
#   - forward_view videos are also saved for human inspection.
# =============================================================================
schema_version: 2
num_sample_batches: 1

# Extra flat keys supported by the config loader.
sample_video_metric_period: 2
sample_video_visual_period: 200
sample_video_visual_on_step0: true
sample_save_forward_view: true
sample_video_max_rank: 2

experiment:
  id: stage1-reverse-world-oracle
  wandb_project: Reverse-WVWAM-Validation
  config_name: stage1_reverse_world_oracle
  cuda_visible_devices: "0,1"

data:
  paths:
    - /mnt/damoxing/datasets/RoboTwin2_0_processed/robotwin_clean_5k_2
  consumer_dataset_type: finetune
  hdf5:
    use_prompt_template: false
  common:
    img_history_size: 1
    action_chunk_size: 32
    num_cameras: 3
    num_vision_patches: 729
    state_dim: 128
    norm_minmax: true
    statistics_mode: separate
  dataset:
    buf_path: /path/to/buffer
    buf_num_chunks: 512
    buf_chunk_size: 512
    epsd_len_thresh_low: 32
    epsd_len_thresh_high: 2048
    image_aspect_ratio: pad
    tokenizer_max_length: 1024
    pred_video: true
    sample_video_fps: 1
    video_size: [384, 320]
    num_cameras: 3
    subtrajectory_mode: fixed_horizon

architecture:
  model:
    action_expert:
      in_action_dim: 256
      in_visual_dim: 1152
      out_action_dim: 128
      inner_dim: 768
      num_layers: 30
      num_attention_heads: 12
      attention_head_dim: 128
      text_dim: 4096
      freq_dim: 256
      ffn_dim: 3072
      max_seq_len: 512
      visual_encoder_type: siglip2
      eps: 1.0e-06
      use_new_rope: true
      scaling: 4.0
      use_value: false
    action_noise_scheduler:
      type: flow
      num_train_timesteps: 1000
      num_inference_timesteps: 5
      beta_schedule: squaredcos_cap_v2
      prediction_type: sample
      clip_sample: false
      alpha: 1.0
      beta: 1.0
      noise_s: 0.999
      distribution_type: beta

  model_name: world_policy_causal_value
  video_variant: wow1.3b
  causal_world_training: true
  dataset_type: 128dim_with_value
  image_aug_type: mixed

checkpoints:
  run_name: validation-stage1-reverse-world-oracle
  root_dir: /mnt/world_foundational_model/fyzhao/reverse_world_model/checkpoints/

weights:
  text_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers
  vision_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/siglip2-so400m-patch14-384
  wam: /mnt/world_foundational_model/fyzhao/reverse_world_model/checkpoints/validation-stage1-reverse-world-oracle/checkpoint-1000
  action_expert: none
  video_expert: none
  video_base_model: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers

training:
  reverse_world_order: true
  batch:
    train: 2
    sample: 2
  vae_mini_batch: 4
  max_train_steps: 1
  checkpointing_period: 999999
  sample_period: 1
  sample_light: true
  sample_joint_only: true
  sample_sharded_inference: false
  sample_compute_video_metrics: false
  sample_save_video: false
  checkpoints_total_limit: 2
  dataloader_num_workers: 4
  gradient_accumulation_steps: 1
  state_noise_snr: 80
  cond_mask_prob: -1
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

optimizer:
  learning_rate: 1.0e-4
  lr:
    scheduler: custom_constant_then_decay
    warmup_steps: 10
    hold_ratio: 0.2

logging:
  report_to: tensorboard
  resume_from_checkpoint: null

runtime:
  mixed_precision: bf16
  load_from_hdf5: true
  gradient_checkpointing: true
  image_aug: true

distributed:
  deepspeed: off

inference: {}
