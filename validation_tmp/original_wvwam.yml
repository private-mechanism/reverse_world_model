# =============================================================================
# 原始正向 WVWAM 基线。
#
# 条件：任务指令 + 当前状态/原始首帧。
# 目标：按正常时间顺序联合生成未来 video 和 action。
# 本方案不翻转时间顺序，不预测 horizon key，不使用 key condition，也不开启
# 帧级 causal attention。它用于和两个 Goal-Conditioned Reverse 方案公平对比。
# =============================================================================
schema_version: 2
num_sample_batches: 1

sample_video_metric_period: 2
sample_video_visual_period: 200
sample_video_visual_on_step0: true
# 正向基线本身已经是正常时间顺序；该开关主要为 reverse 方案保存翻回正序的观察视图。
sample_save_forward_view: true
sample_video_max_rank: 2

experiment:
  id: original-wvwam-baseline
  wandb_project: Reverse-WVWAM-Validation
  config_name: original_wvwam
  cuda_visible_devices: "0,1"

data:
  paths:
    - /mnt/damoxing/datasets/RoboTwin2_0_processed/robotwin_clean_5k_2
  consumer_dataset_type: finetune
  hdf5:
    use_prompt_template: false
  common:
    img_history_size: 1
    # 固定 horizon 内包含 32 个 action step；正向基线直接按 t -> t+H 学习。
    action_chunk_size: 32
    num_cameras: 3
    num_vision_patches: 729
    state_dim: 128
    norm_minmax: true
    statistics_mode: separate
  dataset:
    buf_path: /path/to/buffer
    buf_num_chunks: 512
    buf_chunk_size: 512
    epsd_len_thresh_low: 32
    epsd_len_thresh_high: 2048
    image_aspect_ratio: pad
    tokenizer_max_length: 1024
    pred_video: true
    # 每 1 个 action step 取一个视频时刻；与 action_chunk_size 一起决定预测视频长度。
    sample_video_fps: 1
    video_size: [384, 320]
    num_cameras: 3
    # 使用固定长度连续子轨迹；本方案不把末端帧/动作额外定义为 key condition。
    subtrajectory_mode: fixed_horizon

architecture:
  model:
    action_expert:
      in_action_dim: 256
      in_visual_dim: 1152
      out_action_dim: 128
      inner_dim: 768
      num_layers: 30
      num_attention_heads: 12
      attention_head_dim: 128
      text_dim: 4096
      freq_dim: 256
      ffn_dim: 3072
      max_seq_len: 512
      visual_encoder_type: siglip2
      eps: 1.0e-06
      use_new_rope: true
      scaling: 4.0
      use_value: false
      # Action Expert 的时间维 self-attention 不加因果 mask，可双向查看整个 action chunk。
      frame_causal_self_attn: false
    # Video Expert 的帧级 self-attention 不加因果 mask，可双向查看整个视频序列。
    video_frame_causal_self_attn: false
    # Action query 不启用按帧对齐的 video KV 因果限制；原始 WVWAM 使用完整联合注意力。
    action_video_frame_causal_kv: false
    action_noise_scheduler:
      type: flow
      num_train_timesteps: 1000
      # 推理时从纯噪声到样本执行 5 次调度更新；原始方案对完整 video/action 联合采样。
      num_inference_timesteps: 5
      beta_schedule: squaredcos_cap_v2
      prediction_type: sample
      clip_sample: false
      alpha: 1.0
      beta: 1.0
      noise_s: 0.999
      distribution_type: beta

  # 该模型类具备 causal mask 能力，但是否真正启用由上面三个 causal 开关决定。
  model_name: world_policy_causal_value
  video_variant: wow1.3b
  # 选择 train_world 的联合 world-policy 训练入口；它不代表 causal attention 已开启。
  causal_world_training: true
  dataset_type: 128dim_with_value
  image_aug_type: mixed

checkpoints:
  run_name: validation-original-wvwam-baseline
  root_dir: /mnt/world_foundational_model/fyzhao/reverse_world_model/checkpoints/

weights:
  text_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers
  vision_encoder: /mnt/damoxing/datasets/cjt_personal/pretrained_models/siglip2-so400m-patch14-384
  action_expert: none
  video_expert: none
  video_base_model: /mnt/damoxing/datasets/cjt_personal/pretrained_models/WoW-1-Wan-1.3B-2M-Diffusers

training:
  # 三方案总开关：original 进入原始联合 forward diffusion loss 和推理路径。
  world_generation_variant: original
  # false：训练和采样均保持数据集原始时间顺序，不翻转 video/action。
  reverse_world_order: false
  batch:
    train: 2
    sample: 2
  vae_mini_batch: 4
  max_train_steps: 1000
  checkpointing_period: 1000
  sample_period: 50
  sample_light: false
  # 评估时只运行联合 world sampling，不额外运行 action-only sampler。
  sample_joint_only: true
  sample_sharded_inference: false
  sample_compute_video_metrics: true
  sample_save_video: true
  checkpoints_total_limit: 2
  dataloader_num_workers: 4
  gradient_accumulation_steps: 1
  state_noise_snr: 80
  cond_mask_prob: -1
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

optimizer:
  learning_rate: 1.0e-4
  lr:
    scheduler: custom_constant_then_decay
    warmup_steps: 10
    hold_ratio: 0.2

logging:
  report_to: tensorboard
  logging_dir: tensorboard
  resume_from_checkpoint: null

runtime:
  mixed_precision: bf16
  load_from_hdf5: true
  gradient_checkpointing: true
  image_aug: true

distributed:
  deepspeed: off

# 当前没有额外的部署期覆盖项；扩散步数由 action_noise_scheduler 控制。
inference: {}
